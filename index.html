<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile DP</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .dp-container {
            text-align: center;
        }

        .dp-container img {
            width: 200px;          /* DP size */
            height: 200px;
            border-radius: 50%;    /* Makes it round */
            border: 4px solid #05c55e; /* Optional border */
        }

        .dp-container h2 {
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="dp-container">
        <img src="dp.jpg" alt="Profile Picture">
        <h2>Ahmad Bhai</h2>
    </div>
</body>
</html>
